# 레벨링: 농사(farming) · 채광(mining) · 벌목(woodcutting) · 낚시(fishing) · 전투(combat)
# 바꾼 뒤에는 /servercore reload
# 관리자: /skill set <플레이어> <분야> <레벨>, /skill reset <플레이어>,  내 레벨: /skill
#
# 플레이어가 직접 놓은 원목·광석·수박·호박 등을 다시 캐면 경험치를 안 줘요 (무한 반복 방지)

max-level: 99

# 다음 레벨까지 필요한 경험치 = a + b × 레벨 + c × 레벨²
#   (기본값: 1→2 는 93, 10→11 은 750, 33→34 는 4,637)
curve:
  a: 50
  b: 40
  c: 3

level-up:
  title: "<#ffd34d><bold>%skill% 레벨 UP!"
  subtitle: "<white>Lv.%level%"

# 이 작물들은 다 자랐을 때 캐야 경험치를 줘요
mature-only: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA, PITCHER_CROP]

# 낚시: 아래 표에 없는 걸 낚으면 / 전투: 표에 없는 적대 몹을 잡으면
default-fish-xp: 3
default-monster-xp: 3

