name: ServerCore
version: '${version}'
main: com.htk.core.ServerCore
api-version: '1.21'
description: 서버 전용 기능 모음 (메뉴, 도감, 점프 패드, 도약, 골드, 상점, 레벨링·칭호, HUD, 집 땅, 이장님, 안내서)

commands:
  race:
    description: 공용 동물 경주 관전·참가 및 경기장 관리
    usage: /<command> [watch|help|settrack|removetrack|demo|cancel]
    permission: servercore.race
  achievements:
    description: 공개된 히든 업적과 내 달성 상태 확인
    usage: /<command>
  atitle:
    description: 획득한 업적 칭호 장착·해제
    usage: /<command> [equip <id>|clear]
  npc:
    description: ServerCore NPC 생성·제거·방향 통합 명령어
    usage: /<command> <create|remove|face> <type> | reset mayor <player>
    permission: servercore.admin
  weaponmerchantnpc:
    description: 무기 상인 NPC 생성·제거·방향 변경
    usage: /<command> create|remove|face
    permission: servercore.admin
  weaponshop:
    description: 0강 마을 도구 구매 창 열기 (관리자)
    usage: /<command> [player]
    permission: servercore.admin
  rankboard:
    description: 누적 순위 홀로그램 게시판 관리
    usage: /<command> create <name> farming|mining|woodcutting|fishing | remove <name> | list
    permission: servercore.admin
  ranking:
    description: 농사·채광·벌목·낚시 누적 순위 보기
    usage: /<command> farming|mining|woodcutting|fishing
  cookienpc:
    description: 무료 얼굴 쿠키 NPC 생성 및 제거
    usage: /<command> create|remove|face
    permission: servercore.admin
  blacksmithnpc:
    description: 대장장이 NPC 생성 및 제거
    usage: /<command> create|remove|face
    permission: servercore.admin
  enhance:
    description: 강화 화면 열기 및 전용 재료 지급 (관리자)
    usage: /<command> [player] | material <type> <1~64> [player]
    permission: servercore.admin
  menu:
    description: 마을 메뉴를 엽니다
  dogam:
    description: 도감을 엽니다
    usage: /<command> [page] | reset <player>
    aliases: [collection]
  money:
    description: 골드 보기 / 골드 주머니 꺼내기
    usage: /<command> [amount] | give|take|set <player> <amount>
    aliases: [gold]
    permission: servercore.money
  shop:
    description: 상점 열기 (관리자)
    usage: /<command> <shop> [player]
    permission: servercore.admin
  shopnpc:
    description: 상점 주인 NPC 세우기/없애기 (관리자)
    usage: /<command> create <shop> | remove | face
    permission: servercore.admin
  skill:
    description: 스킬 창 열기 / 레벨 설정 (관리자)
    usage: /<command> [info] | set <player> <category> <level> | reset <player>
    aliases: [skills]
  honor:
    description: 칭호 목록 / 칭호 달기
    usage: /<command> [category:level|off]
    aliases: [titles]
  hud:
    description: HUD 켜기/끄기, 위치 맞추기
    usage: /<command> [on|off] | left [steps] | right [steps] | pos <number> | reset
  guide:
    description: 서버 안내서(책) 받기
  land:
    description: 내 집 땅 (집터, 지도 창, 넓히기·이웃 허가)
    usage: /<command> [kit|home|sethome|trust <name>|untrust <name>|show|info|abandon confirm]
    aliases: [home, house]
  jumppad:
    description: 점프 패드 아이템 받기
    usage: /<command> [amount] [player]
    permission: servercore.admin
  mayornpc:
    description: 이장님 NPC 세우기/없애기, 첫 대화 되돌리기 (관리자)
    usage: /<command> create | remove | face | reset <player>
    permission: servercore.admin
  villagetool:
    description: 마을 도구 주기 / 강화 단계 바꾸기 (관리자, 모양 확인용)
    usage: /<command> give <type> [level] [player] | level <level>
    permission: servercore.admin
  servercore:
    description: ServerCore 관리 명령어
    usage: /<command> reload | setpoint <name> | delpoint <name> | points

permissions:
  servercore.race:
    description: 동물 경주 관전·참가
    default: true
  servercore.menu:
    description: 메뉴 열기
    default: true
  servercore.dogam:
    description: 도감 열기
    default: true
  servercore.money:
    description: /money 쓰기
    default: true
  servercore.longjump:
    description: 달리면서 점프하면 도약
    default: true
  servercore.admin:
    description: 관리 명령어 (reload, 도감 reset)
    default: op
