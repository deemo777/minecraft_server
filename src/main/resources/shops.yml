# 상점 (NPC 상점 주인을 클릭하면 열려요)
#
# 상점 주인 세우기:  /shopnpc create <상점이름>   (지금 서 있는 곳, 나를 바라보게)
# 상점 주인 없애기:  /shopnpc remove              (5칸 안의 가장 가까운 주인)
# 바꾼 뒤에는 /servercore reload
#
# 상점 항목
#   title            상점 화면 위쪽 띠에 쓰이는 이름
#   theme            배경 그림: fish(바다) / crops(농장) / ores(광산)
#   npc-name         상점 주인 머리 위 이름
#   npc-profession   상점 주인 옷: fisherman, farmer, toolsmith, armorer, weaponsmith, butcher, librarian ... (none = 기본)
#   items            품목 (적은 순서대로 칸에 놓여요)
#     sell: 플레이어가 팔 때 받는 골드 (1개 값)
#     buy:  플레이어가 살 때 내는 골드 (1개 값) — 지금은 사들이기만 하는 상점이라 비워 둠
#
# 화면: 주민 교환처럼 [아이템] → [골드] 줄이 왼쪽 5개 + 오른쪽 5개 (10개 넘으면 페이지)
# 조작 (주민 교환처럼):
#   골드 칸 클릭   = 가방의 아이템 1개 팔고 골드 주머니가 마우스 커서에 (계속 누르면 쌓여요) / Shift: 전부 팔고 가방에
#   아이템 칸 클릭 = buy 가격으로 1개 사서 커서에 / Shift: 한 묶음을 가방에. 골드 주머니로 내고, 모자라면 잔액에서. 거스름돈은 주머니로
#   상점 창이 열려 있어도 아래 내 가방은 평소처럼 쓸 수 있어요 (커서의 주머니를 내려놓기 등)
# 이름이 붙었거나 인챈트된 아이템은 팔리지 않아요 (실수로 귀한 물건을 파는 것 방지)

