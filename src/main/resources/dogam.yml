# 도감 설정 (스타듀밸리 수집품 판)
#
# 등록: 항목 클릭 → 가방에서 남은 요구량까지만 차감해 누적. 숫자는 남은 수량, 완료는 숫자 없이 체크.
# 한 페이지 = 9칸 × 5줄 = 45개, 맨 아래 줄 양 끝 화살표로 페이지 이동
#
# ⚠ 등록한 항목의 체크 표시는 리소스팩에 아이템별로 들어가요.
#   항목을 추가/삭제했다면 tools/build_pack.py 로 리소스팩을 다시 만들어 올리세요.

# 도감에 보이는 순서
#   creative : 아래 categories 순서대로 묶고(나무 → 땅과 돌 → … → 음반), 같은 묶음 안에서는 크리에이티브 인벤토리 순서
#              (순서 목록은 플러그인 안의 creative_order.txt, 마인크래프트 26.3에서 미리 뽑아 둠)
#              묶음별로 창이 나뉘지 않고 이어서 페이지로 넘겨요
#   file     : 이 파일에 적힌 순서 그대로
order: creative

# 맨 위 나무판에 쓰이는 제목
title: "<#6b4226>도감 진행도 (%found%/%total%)"

messages:
  registered: "<gold>[도감]</gold> <white>등록 완료:</white> %entry% <gray>(%found%/%total%)</gray>"
  category-complete: "<gold>[도감]</gold> <green><bold>%category%</bold> 항목을 모두 채웠어요!</green>"
  already-registered: "<gold>[도감]</gold> <gray>%entry%<gray>은(는) 이미 등록했어요."
  not-enough: "<gold>[도감]</gold> %entry% <gray>을(를) 등록하려면 <white>%required%개</white>가 필요해요. <dark_gray>(보유 %have%개)"
  tooltip-registered: "<#8fd16a>✔ 등록 완료"
  tooltip-unregistered: "<#e06c6c>미등록 <dark_gray>· <gray>필요 <white>%required%개</white> <dark_gray>(보유 %have%개)"
  tooltip-click: "<#f2a65a>▶ 클릭해서 등록"
  prev-page: "<#f3c060>◀ 이전 페이지"
  next-page: "<#f3c060>다음 페이지 ▶"
  no-more-page: "<gray>더 넘길 페이지가 없어요"

