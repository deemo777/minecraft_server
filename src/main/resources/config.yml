# ServerCore 공통 설정
# 글자 색은 MiniMessage 형식이에요. 예: <green>초록</green>, <#f3c060>색 코드</#f3c060>

# 기능 켜기/끄기 (바꾼 뒤에는 서버 재시작)
features:
  weapon-merchant: true # 마을 도구 0강 판매 NPC (economy·tools 필요)
  ranking: true    # 농사·채광·벌목·낚시 누적 순위 게시판
  cookie: true     # 무료 얼굴 쿠키 NPC
  menu: true
  dogam: true
  jumppad: true   # 점프 패드 (/jumppad 로 아이템 받기)
  longjump: true  # 도약: 달리면서 점프하면 멀리 뛰기
  economy: true   # 골드(G), /money
  shop: true      # NPC 상점 (shops.yml, 골드 기능이 켜져 있어야 해요)
  skills: true    # 레벨링: 농사·채광·벌목·낚시·전투 (skills.yml)
  guide: true     # 서버 안내서 책 (처음 접속하면 1권, /guide 로 다시 받기, 내용은 guide.yml)
  land: true      # 내 집 땅 (/land, 골드 기능이 켜져 있어야 해요)
  mayor: true     # 로비의 이장님: 첫 대화를 마치면 집터, 빚은 이장님께 갚기 (골드·집 땅이 켜져 있어야 해요)
  tools: true     # 마을 도구 (곡괭이·도끼·괭이·낚싯대, 강화 단계별 3D 모양, 인챈트 금지 — tools.yml)
  blacksmith: true # 대장장이 NPC·강화 GUI·전용 강화 재료 (tools가 켜져 있어야 해요)
  hud: true      # 왼쪽 위 HUD + 경험치 바 (골드·레벨링이 켜져 있고 리소스팩을 쓸 때)

# 리소스팩(스타듀밸리 배경 그림, 체크 표시, 화살표)을 쓰는지
# false면 리소스팩 없이 바닐라 상자 모양으로 보여줘요 (테스트용)
resourcepack:
  enabled: true

menu:
  # Shift(웅크리기) + F(양손 바꾸기)로 메뉴 열기
  open-with-sneak-swap: true
  # 접속할 때 안내 메시지 (비워두면 안 보냄)
  join-hint: "<#f3c060>🌾 <white>Shift + F</white><gray>를 누르면 마을 메뉴가 열려요."

# 점프 패드: 중량 무게 압력판과 똑같이 생긴 "점프 패드" 아이템을 설치하면, 밟을 때 앞+위로 튕겨요 (모든 월드)
# 바꾼 뒤 /servercore reload
jump-pad:
  item-name: "<#7ad1ff><bold>점프 패드"
  forward: 1.6            # 앞으로 튀는 세기 (0이면 제자리 위로만)
  up: 0.9                 # 위로 튀는 세기
  use-look-pitch: false   # true면 위아래로 바라보는 각도도 반영 (위를 보면 더 높이)
  cooldown-ticks: 20      # 한 번 튕긴 뒤 다시 튕기기까지 (20틱 = 1초)
  no-fall-damage: true    # 튕긴 뒤 첫 낙하 피해 없음
  sound: "minecraft:entity.wind_charge.wind_burst"   # 비우면 소리 없음
  sound-volume: 1.0
  sound-pitch: 1.2
  particle: "CLOUD"       # 비우면 파티클 없음
  particle-count: 20

# 도약: 달리면서 점프하면 바라보는 방향으로 멀리 뛰어요 (쿨타임 동안은 일반 점프)
# 바꾼 뒤 /servercore reload
long-jump:
  worlds: [village, lobby]       # 도약을 쓸 수 있는 월드 (비우면 모든 월드). 예: [world, village]
  forward: 1.3            # 앞으로 뛰는 세기
  up: 0.55                # 위로 뛰는 세기
  cooldown-seconds: 5
  no-fall-damage: true    # 도약 뒤 첫 낙하 피해 없음
  sound: "minecraft:entity.breeze.jump"   # 비우면 소리 없음
  sound-volume: 0.8
  sound-pitch: 1.2
  particle: "CLOUD"       # 비우면 파티클 없음
  particle-count: 12

# 골드(G)
#   /money            내 골드 보기
#   /money <amount>      골드 주머니 아이템으로 꺼내기 (던져서 다른 사람에게 줄 수 있어요. 우클릭하면 다시 잔액으로)
#   /money give|take|set <player> <amount>   (관리자)
# 잔액은 plugins/ServerCore/money.yml
economy:
  starting-balance: 1000          # 처음 접속할 때 주는 골드
  item-material: GOLD_NUGGET      # 골드 주머니 아이템 모양
  item-name: "<#ffd34d><bold>%amount%"
  item-lore:
    - "<gray>우클릭하면 내 골드에 넣어요"
    - "<dark_gray>Shift+우클릭: 손에 든 묶음 전부"
  messages:
    balance: "<gray>보유 골드: <#ffd34d>%balance%"
    withdrawn: "<#ffd34d>%amount%<gray> 골드 주머니를 꺼냈어요. <dark_gray>(남은 골드 %balance%)"
    deposited: "<#ffd34d>+%amount%  <gray>(보유 %balance%)"
    not-enough: "<red>골드가 부족해요. <gray>(보유 %balance%)"
    bad-amount: "<red>금액은 1 이상의 숫자로 적어 주세요. 예: /money 500"

# NPC 상점 (품목·가격은 shops.yml) — 주민 교환처럼 [아이템] → [골드]
#   골드 칸 클릭: 가방의 아이템 1개를 팔고 골드 주머니가 마우스 커서에 (계속 누르면 쌓임) / Shift: 전부 팔고 가방에
#   아이템 칸 클릭: 골드 주머니(모자라면 잔액)로 1개 사서 커서에 / Shift: 한 묶음을 가방에. 거스름돈은 주머니로
shop:
  messages:
    gold-name: "<#ffd34d><bold>%price%"
    lore-sell: "<gray>클릭: 1개 팔기 <dark_gray>(Shift: 전부 %have%개 → %total%)"
    lore-buy: "<gray>클릭: <#ffd34d>%price%</#ffd34d>로 1개 사기 <dark_gray>(Shift: 한 묶음)"
    sold: "<#ffd34d>%amount% <gray>골드 주머니를 받았어요 (%count%개 판매)"
    bought: "<gray>%count%개 구매 <dark_gray>(-%amount%)"
    nothing-to-sell: "<red>팔 물건이 없어요."
    not-enough-gold: "<red>골드가 부족해요."
    inventory-full: "<red>가방에 자리가 없어요."
    closed: "<gray>지금은 문을 닫았어요."
    cursor-busy: "<gray>들고 있는 아이템을 먼저 내려놓아 주세요."

# 화면 HUD (왼쪽 위: 얼굴·이름·골드·레벨 / 경험치를 얻으면 위에 "농사 레벨 33 [962/4,375]")
#   플레이어는 /hud 로 켜고 끌 수 있어요
hud:
  # 화면 가운데에서 왼쪽으로 몇 칸에 둘지 (GUI 크기 4 + 1920x1080 기준 -236 이 왼쪽 끝)
  # 화면이 넓거나 GUI 크기가 작으면 왼쪽 끝보다 안쪽에 보여요. 더 왼쪽으로: -300 처럼
  # 이건 처음 기본값이고, 플레이어는 각자 /hud left·right·pos·reset 으로 자기 화면에 맞출 수 있어요
  offset-x: -236
  xp-bar-seconds: 3     # 경험치를 얻은 뒤 경험치 바를 보여주는 시간

# 내 집 땅 (동물의 숲 방식)
#   처음 접속하면 "집터" 블록을 받아요 (잃어버리면 /land kit). 설치하면 그 청크가 바로 내 집이 돼요.
#   집터를 우클릭하면 집 지도 창 → 붙어 있는 청크를 골라 하나씩 넓혀요. 집터는 아무도 못 부숴요.
#   넓히면 땅은 바로 생기고 그 값만큼 빚이 생겨요. 빚을 다 갚아야 다음 확장 가능.
#   이웃(/land trust <name>)은 내 땅에서 전부 할 수 있고, 나머지 사람은 아무것도 못 해요.
#   관리자: /land bypass (남의 땅도 만지기 켜기/끄기), /land delete <name>, /land give <name> (집터 주기)
land:
  # 집을 지을 수 있는 월드는 마을(village)로 고정이에요 (코드에서 정해요, 다른 월드에서는 집터를 못 놓아요)
  core-block: LODESTONE    # 집터 아이템의 바탕 블록 (리소스팩이 있으면 집 모형으로 보이고, 설치하면 방벽+집 모형으로 바뀌어요)
  give-core-on-first-join: true   # 처음 접속할 때 집터 주기 (이장님 기능이 켜져 있으면 무시하고 이장님이 줘요)
  max-chunks: 4            # 호환용 항목. 실제 부지는 2×2, 4청크로 고정
  # 집 사이에 빈 청크 간격은 요구하지 않아요. 예약한 2×2 부지가 겹치는 것만 막아요.
  first-cost: 50000            # 처음 집 짓기 빚 (0 = 무료)
  expand-costs: [150000, 500000, 1000000]   # 2·3·4번째 청크를 해방할 때 생기는 빚 (현재 빚을 먼저 전액 상환)
  protect-from-explosions: true      # 크리퍼·TNT 폭발에서 땅 보호
  # 문구는 land.messages.<name> 으로 바꿀 수 있어요 (README 참고)

# 이장님 (로비) — /mayornpc create 로 세우기
#   우클릭 → 첫 인사/재방문 인사 + 집터 수령·빚 전액 상환.
#   집터 안내는 매 장 '다 읽음' 체크 후 진행합니다. 안내·버튼 문구는 서버 코드에서 관리합니다.
#   /mayornpc reset <player>: 대화·안내 기록 초기화 (기존 집·아이템은 보존)
mayor:
  npc-name: "<#f3c060><bold>이장님"
  messages:
    join-hint: "<#f3c060>🌾 <gray>로비의 이장님께 말을 걸어 집터 안내를 받아 보세요!"

# 메뉴의 이동 버튼 (집으로 등): 화면에 숫자를 센 뒤 이동
teleport:
  countdown-seconds: 2                       # 0이면 바로 이동
  countdown-title: "<#f3c060><bold>%seconds%"
  countdown-subtitle: "<gray>이동 중…"

messages:
  no-permission: "<red>권한이 없어요."
  feature-disabled: "<red>지금은 꺼져 있는 기능이에요."
  coming-soon: "<#f3c060>🌾 <gray>아직 준비 중인 기능이에요. 조금만 기다려 주세요!"
  reloaded: "<green>ServerCore 설정을 다시 불러왔어요."
  point-not-set: "<#f3c060>🌾 <gray>아직 이동할 곳(%point%)이 정해지지 않았어요. 관리자에게 알려 주세요."
  point-world-missing: "<red>이동할 월드(%world%)가 지금 꺼져 있어요."
