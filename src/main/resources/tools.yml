# 광 도구 5종. 이름은 광 + 도구명으로 고정, 강화 단계별 색·별·모델 유지.
# 곡괭이: +0 다이아, +10 효율 V/행운 III, +15~20 행운 IV, +20 효율 VII.
# 도끼: 단계마다 원목 2배 확률 2.5%, +20 자연 나무 연쇄 벌목.
# 물뿌리개 범위: +0 1칸 / +5 좌우 3칸 / +10 3×3 / +15~20 4×4.
# 물주기 1회당 물 1회분 사용. +0 20회, +5 25회, +10 30회, +15 35회, +20 무한.
# 모든 +20 마을 도구: 내구도 무한, 용암·불 피해 면역.
# /villagetool give <type> [level] [player] · /villagetool level <level>
# 기존 도구도 로그인·손 교체·인벤토리 닫기 때 이름/강화 성능을 갱신합니다.

max-level: 20          # 최대 강화 단계
allow-enchant: false   # false = 인챈트 테이블·모루·숫돌에 못 올림

# 전용 재료는 마을 도구 사용 시 2% 확률로 1개. 실패에도 소비, 별도 골드 비용 없음.
# 목표 단계 +1~5=1개, +6~10=2개, +11~15=3개, +16~20=4개.
# 실패: +1~10 유지, +11~15 30%로 하락(최저 +10), +16~20 50%로 하락(최저 +15), 파괴 없음.
enhancement:
  drop-chance: 0.02
  success-rates: [100, 95, 90, 85, 80, 75, 70, 65, 60, 55, 50, 45, 40, 35, 30, 25, 20, 15, 12, 10]

level-suffix: " +%level%"   # 이름 뒤에 붙는 단계 (+0 이면 안 붙어요)
stars:
  filled: "<#ffd34d>★"
  empty: "<dark_gray>☆"
  per-row: 10           # 한 줄에 별 몇 개

# names: 기본 이름 참고용 (실제 이름은 코드에서 광 + 도구명으로 고정)
#   색: +0 회색 → +5 초록 → +10 파랑 → +15 보라 → +20 금색
tools:
  pickaxe:
    names:
      0: "<#d9d9d9><bold>광 곡괭이"
      5: "<#7acb52><bold>광 곡괭이"
      10: "<#6aa8e0><bold>광 곡괭이"
      15: "<#b57edc><bold>광 곡괭이"
      20: "<#ffd34d><bold>광 곡괭이"
    lore:
      - "<gray>마을 곡괭이 · 대장장이의 작품"
  axe:
    names:
      0: "<#d9d9d9><bold>광 도끼"
      5: "<#7acb52><bold>광 도끼"
      10: "<#6aa8e0><bold>광 도끼"
      15: "<#b57edc><bold>광 도끼"
      20: "<#ffd34d><bold>광 도끼"
    lore:
      - "<gray>마을 도끼 · 대장장이의 작품"
  hoe:
    names:
      0: "<#d9d9d9><bold>광 괭이"
      5: "<#7acb52><bold>광 괭이"
      10: "<#6aa8e0><bold>광 괭이"
      15: "<#b57edc><bold>광 괭이"
      20: "<#ffd34d><bold>광 괭이"
    lore:
      - "<gray>마을 괭이 · 대장장이의 작품"
  fishing_rod:
    names:
      0: "<#d9d9d9><bold>광 낚싯대"
      5: "<#7acb52><bold>광 낚싯대"
      10: "<#6aa8e0><bold>광 낚싯대"
      15: "<#b57edc><bold>광 낚싯대"
      20: "<#ffd34d><bold>광 낚싯대"
    lore:
      - "<gray>마을 낚싯대 · 대장장이의 작품"
  watering_can:     # 지금은 아이템만 (물 주기 농사는 나중에)
    names:
      0: "<#d9d9d9><bold>광 물뿌리개"
      5: "<#7acb52><bold>광 물뿌리개"
      10: "<#6aa8e0><bold>광 물뿌리개"
      15: "<#b57edc><bold>광 물뿌리개"
      20: "<#ffd34d><bold>광 물뿌리개"
    lore:
      - "<gray>마을 물뿌리개 · 대장장이의 작품"

# 별 아래에 붙는 줄
lore-footer:
  - ""
  - "<dark_gray>인챈트할 수 없어요 · 강화는 대장장이에게"

messages:
  not-tool: "<red>손에 마을 도구를 들어 주세요."
