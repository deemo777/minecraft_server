# 광 도구 5종. 0~4 철 도구, +5부터 다이아 성능 (물뿌리개·낚싯대는 기존 바탕 유지).
# 곡괭이: +10 효율 III/행운 I·II 각 50%, +15 효율 V/행운 III, +20 효율 VI/행운 IV, +25 효율 VII/행운 IV.
# 도끼: +10 효율 IV, +15 효율 V/섬세한 손길, +20 효율 VI, +25 효율 VII/전체 자연 나무 벌목.
# 곡괭이·도끼 +20~24: 같은 종류로 연결된 자연 자원 1~5개 추가 채굴. +25는 최대 총 4,096개.
# 괭이: +0 1칸 / +5 가로 3칸 / +10 가로 5칸 / +15 5+3칸 / +20 행운 II / +25 주변 5×5와 행운 III.
# 물뿌리개 범위·용량은 기존 유지, +25부터 물 무한. 모든 도구 +25부터 내구도 무한·용암/불 면역.
# 도구 설명은 별만 표시합니다. 이전 tools.*.lore 및 lore-footer는 사용하지 않습니다.
# 기존 max-level: 20은 25로 호환됩니다. 새 최대 단계는 25입니다.

max-level: 25          # 최대 강화 단계
allow-enchant: false   # false = 인챈트 테이블·모루·숫돌에 못 올림

# 전용 재료는 마을 도구 사용 시 2% 확률로 1개. 실패에도 소비, 별도 골드 비용 없음.
# 목표 단계 +1~5=0개, +6~10=1개, +11~15=2개, +16~20=4개, +21~25=8개.
# +6~15 성공률은 75%에서 단계마다 2.5%p 감소합니다. 기존 기본 확률 배열은 자동 호환합니다.
# 실패: +1~10 유지, +11~15 30%로 하락(최저 +10), +16~20/+21~25 50%로 하락(최저 +15/+20), 파괴 없음.
enhancement:
  drop-chance: 0.02
  success-rates: [100, 95, 90, 85, 80, 75, 72.5, 70, 67.5, 65, 62.5, 60, 57.5, 55, 52.5, 25, 20, 15, 12, 10, 8, 6, 5, 4, 3]

level-suffix: " +%level%"   # 이름 뒤에 붙는 단계 (+0 이면 안 붙어요)
stars:
  filled: "<#ffd34d>★"
  empty: "<dark_gray>☆"
  per-row: 10           # 한 줄에 별 몇 개

# names: 기본 이름 참고용 (실제 이름은 코드에서 광 + 도구명으로 고정)
#   색: +0 회색 → +5 초록 → +10 파랑 → +15 보라 → +20 주황 → +25 금색
