# 광 도구 5종. 곡괭이·도끼·괭이: +0~4 철 / +5~19 다이아 / +20~25 네더라이트.
# 실제 인챈트 대신 강화 단계별 수치 보정 사용. 0~24강 내구도 소모 100%, +25 무한.
# 곡괭이 드롭 강도 0/5/10/15/20/25강: 0/0/1/3/4/4. 0~9강 없음, 10~20강 사이 보간, 20강 이후 IV 고정.
# 연결 자연 광석: 20강까지 추가 0개, 21~25강은 원래 블록 포함 총 2/3/4/5/6개 고정.
# 상세 단계별 수치는 docs/기능/커스텀도구와강화.md 및 장비강화_단계별수치.md 참고.
# 도구 설명은 별만 표시합니다. 이전 tools.*.lore 및 lore-footer는 사용하지 않습니다.
# 기존 max-level: 20은 25로 호환됩니다. 새 최대 단계는 25입니다.

max-level: 25          # 최대 강화 단계
# 수리비: 기본요금 + 복구 내구도 1당 1G. +0~9: 0G / +10~14: 500G / +15~19: 1,000G / +20~24: 4,000G / +25: 10,000G.
# 정상·무한 내구도 도구는 수리하지 않습니다. 기존 repair.full-cost는 사용하지 않습니다.
allow-enchant: false   # false = 인챈트 테이블·모루·숫돌에 못 올림

# 도끼·괭이·물뿌리개 결정: 기본 2% + 관련 스킬 레벨당 0.2%p, 최대 12%. 결정 비용은 유지하며 골드는 각 시도에 별도 소모합니다.
# 곡괭이 예외: 돌·심층암은 고정 2%. 일반 광물은 기본 5~15% + 채광 레벨당 0.2%p(기본 최대 +10%p).
# 구리 5%, 석탄·청금석·네더 금·네더 석영 8%, 철·레드스톤 10%, 금 8%, 다이아몬드 15%.
# 에메랄드·고대 잔해는 기본 50%에서 채광 50레벨에 100%까지 선형 증가(일반 보너스 상한과 별도).
# 화강암·섬록암·안산암·응회암·네더랙 등 나머지 블록에서는 곡괭이 결정이 나오지 않습니다.
# 목표 단계 +1~5=0개, +6~10=1개, +11~15=2개, +16~20=4개, +21~25=8개.
# +6~15 성공률은 75%에서 단계마다 2.5%p 감소합니다. 기존 기본 확률 배열은 자동 호환합니다.
# 실패: 단계 하락 없음. 실패 보너스·장인의 기운은 도구에 저장, 성공하면 초기화.
# 실패마다 기본 확률의 10% 추가(최대 기본의 2배). 목표 +4부터 일반 확률 상한 99.99%(기본 100% 제외).
# 목표 +4~15 실패 천장: 1/2/4/6/8/10/12/14/16/18/19/20회. 다음 시도 확정 성공.
# 목표 +1~3: 기운 += 해당 시도 확률 / 2.15 (최소 1%p). +16~25: 기존 천장 실패 횟수의 2배 기준.
# 단, 목표 +16~24는 실패 천장 최소 40회부터 단계마다 4회 증가(+24=72회). +25 기본 천장 78회.
# 사용자 설정 확률의 기존 천장이 더 길면 유지.
# 기운 100%면 다음 시도 확정 성공. 확정 시도도 해당 단계의 결정 비용을 소비합니다.
enhancement:
  drop-chance: 0.02
  drop-per-skill-level: 0.002
  drop-max-chance: 0.12
  # 낚싯대 결정은 별도 고정 곡선: 기본 10% + 낚시 레벨당 0.6%p, 50레벨 최대 40%.
  # 이전 fishing-drop-multiplier 설정은 사용하지 않습니다.
  # 목표 +1~25 순서. 성공·실패·장기백 모두 같은 비용, 부족하면 시도하지 않습니다.
  gold-costs: [500, 500, 500, 500, 500, 1000, 1500, 2000, 2500, 3000, 3000, 3750, 4500, 5250, 6000, 6000, 7500, 9000, 10500, 12000, 12000, 16500, 21000, 25500, 30000]
  success-rates: [100, 95, 90, 85, 80, 75, 72.5, 70, 67.5, 65, 62.5, 60, 57.5, 55, 52.5, 25, 20, 15, 12, 10, 8, 6, 5, 4, 3]

level-suffix: " +%level%"   # 이름 뒤에 붙는 단계 (+0 이면 안 붙어요)
stars:
  filled: "<#ffd34d>★"
  empty: "<dark_gray>☆"
  per-row: 10           # 한 줄에 별 몇 개

