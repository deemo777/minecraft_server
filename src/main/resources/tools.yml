# 마을 도구 (대장장이에게 사는 곡괭이·도끼·괭이·낚싯대) — 자세한 설계는 강화도구_설계.md
# 성능은 다이아 도구 그대로 (낚싯대는 낚싯대). 강화 능력은 나중에 더해요
# 지금 들어간 것: 도구 아이템(이름·별·3D 모양), 인챈트 금지, 관리자 명령어
#   /villagetool give <종류> [단계] [플레이어]   종류: pickaxe axe hoe fishing_rod watering_can (또는 곡괭이 도끼 괭이 낚싯대 물뿌리개)
#   /villagetool level <단계>                    손에 든 마을 도구의 강화 단계 바꾸기 (모양 확인용)
# 강화·능력·수리·대장장이 NPC 는 설계가 정해지면 추가해요. 바꾼 뒤 /코어 reload
#   (이미 만들어진 도구의 이름·별은 다음에 단계가 바뀔 때 새로 그려져요)

max-level: 20          # 최대 강화 단계
allow-enchant: false   # false = 인챈트 테이블·모루·숫돌에 못 올림

level-suffix: " +%level%"   # 이름 뒤에 붙는 단계 (+0 이면 안 붙어요)
stars:
  filled: "<#ffd34d>★"
  empty: "<dark_gray>☆"
  per-row: 10           # 한 줄에 별 몇 개

# names: 강화 단계별 이름 (그 단계 이상이면 그 이름, 5강마다 모양과 같이 바뀌어요)
#   색: +0 회색 → +5 초록 → +10 파랑 → +15 보라 → +20 금색
tools:
  pickaxe:
    names:
      0: "<#d9d9d9><bold>돌울림"
      5: "<#7acb52><bold>깊은 메아리"
      10: "<#6aa8e0><bold>드워프의 맥박"
      15: "<#b57edc><bold>용암심장"
      20: "<#ffd34d><bold>별을 캐는 자, 아스트라"
    lore:
      - "<gray>마을 곡괭이 · 대장장이의 작품"
  axe:
    names:
      0: "<#d9d9d9><bold>나무꾼의 서약"
      5: "<#7acb52><bold>숲울음"
      10: "<#6aa8e0><bold>고목의 분노"
      15: "<#b57edc><bold>이그드라실의 송곳니"
      20: "<#ffd34d><bold>세계수를 베는 자, 칼라드"
    lore:
      - "<gray>마을 도끼 · 대장장이의 작품"
  hoe:
    names:
      0: "<#d9d9d9><bold>흙내음"
      5: "<#7acb52><bold>풍요의 손길"
      10: "<#6aa8e0><bold>새벽이슬"
      15: "<#b57edc><bold>황금 이랑"
      20: "<#ffd34d><bold>대지의 노래, 세레스"
    lore:
      - "<gray>마을 괭이 · 대장장이의 작품"
  fishing_rod:
    names:
      0: "<#d9d9d9><bold>잔물결"
      5: "<#7acb52><bold>은빛 바늘"
      10: "<#6aa8e0><bold>심해의 속삭임"
      15: "<#b57edc><bold>레비아탄의 실"
      20: "<#ffd34d><bold>바다왕의 부름, 넵투라"
    lore:
      - "<gray>마을 낚싯대 · 대장장이의 작품"
  watering_can:     # 지금은 아이템만 (물 주기 농사는 나중에)
    names:
      0: "<#d9d9d9><bold>이슬방울"
      5: "<#7acb52><bold>봄비"
      10: "<#6aa8e0><bold>샘의 정령"
      15: "<#b57edc><bold>폭포의 숨결"
      20: "<#ffd34d><bold>하늘비의 여신, 레이나"
    lore:
      - "<gray>마을 물뿌리개 · 대장장이의 작품"

# 별 아래에 붙는 줄
lore-footer:
  - ""
  - "<dark_gray>인챈트할 수 없어요 · 강화는 대장장이에게"

messages:
  not-tool: "<red>손에 마을 도구를 들어 주세요."
